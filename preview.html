<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Interpreter · Bangla Explainer</title>
  <style>
    :root { color-scheme: dark; --bg: #07131f; --line: rgba(144,187,210,.18); --muted: #9cb2c1; --teal: #37d6c1; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; color: #f4f8fb; background: radial-gradient(ellipse at 50% 0%, #0d2a39 0%, var(--bg) 60%); font: 15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width: min(1120px, 100%); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 0 0 16px; }
    .eyebrow { color: var(--teal); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; }
    h1 { margin: 6px 0 0; font-size: clamp(22px, 3vw, 34px); line-height: 1.15; }
    .badge { padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); white-space: nowrap; }
    .frame { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: #02070c; box-shadow: 0 24px 80px rgba(0,0,0,.45); }
    video { width: 100%; display: block; aspect-ratio: 16 / 9; background: #02070c; }
    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin: 14px 2px 0; color: var(--muted); font-size: 13px; }
    a { color: #72e7d5; text-decoration: none; } a:hover { text-decoration: underline; }
    @media (max-width: 640px) { body { padding: 14px; } header { align-items: flex-start; flex-direction: column; } .badge { font-size: 12px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow">Educational motion film · 1080p</div><h1>How the Python Interpreter Works</h1></div>
      <div class="badge">বাংলা narration · word-highlight subtitles · no music</div>
    </header>
    <div class="frame"><video controls preload="metadata" playsinline src="/video.mp4"></video></div>
    <footer><span>Voice and scene-synchronized UI sound effects only.</span><span><a href="/subtitles.srt" download>Download Bangla subtitle file (SRT)</a></span></footer>
  </main>
</body>
</html>
